<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>GROBY-PRO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>GROBY-PRO</h1>
        <p>Sprzątanie i obsługa nagrobków</p>
      </div>
      <button id="logoutBtn" class="ghost hidden">Wyloguj</button>
    </header>

    <section id="loginView" class="panel">
      <h2>Logowanie</h2>
      <p class="muted">Zaloguj się, aby korzystać ze wspólnej bazy zleceń.</p>
      <form id="loginForm">
        <label>Email<input id="email" type="email" autocomplete="email" required></label>
        <label>Hasło<input id="password" type="password" autocomplete="current-password" required></label>
        <button class="primary" type="submit">Zaloguj</button>
      </form>
      <div id="loginMsg" class="message"></div>
    </section>

    <section id="appView" class="hidden">
      <div class="stats">
        <div><b id="countAll">0</b><span>Wszystkie</span></div>
        <div><b id="countOpen">0</b><span>Do wykonania</span></div>
        <div><b id="countDone">0</b><span>Wykonane</span></div>
        <div><b id="sumMoney">0,00 zł</b><span>Z wykonanych</span></div>
      </div>

      <div class="toolbar">
        <input id="search" type="search" placeholder="Szukaj klienta, telefonu, cmentarza...">
        <select id="filter">
          <option value="all">Wszystkie</option>
          <option value="open">Do wykonania</option>
          <option value="done">Wykonane</option>
        </select>
        <button id="addBtn" class="primary">＋ Nowe zlecenie</button>
      </div>

      <div id="statusMsg" class="message"></div>
      <div id="empty" class="empty">Brak zleceń.</div>
      <div id="list"></div>
    </section>
  </main>

  <dialog id="dialog">
    <form id="form" method="dialog" class="dialogForm">
      <h2 id="formTitle">Nowe zlecenie</h2>
      <input id="editId" type="hidden">
      <label>Klient<input id="client" required></label>
      <label>Telefon<input id="phone" type="tel"></label>
      <label>Cmentarz<input id="cemetery"></label>
      <label>Lokalizacja grobu<input id="grave"></label>
      <label>Usługa<input id="service" placeholder="np. sprzątanie nagrobka"></label>
      <label>Data<input id="date" type="date"></label>
      <label>Cena (zł)<input id="price" type="number" min="0" step="0.01"></label>
      <label>Uwagi<textarea id="notes" rows="3"></textarea></label>
      <div class="dialogButtons">
        <button id="cancelBtn" type="button" class="secondary">Anuluj</button>
        <button class="primary" type="submit">Zapisz</button>
      </div>
    </form>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="nagrobki_script.js"></script>
</body>
</html>
